<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar no Acervo | Postais da Parnaiba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <style>
      .auth-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--color-bg);
        padding: 1rem;
      }
      .auth-shell { width: min(92vw, 420px); }
      .auth-card {
        background: linear-gradient(180deg, rgba(255, 251, 244, 0.98) 0%, rgba(247, 240, 228, 0.98) 100%);
        border: 1px solid var(--color-border-soft);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-strong);
        padding: 2.5rem 2rem;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .auth-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--color-primary-strong), var(--color-primary), var(--color-primary-strong));
      }
      .auth-ornament {
        font-size: 1.5rem;
        color: var(--color-primary);
        opacity: 0.5;
        margin-bottom: var(--sp-md);
      }
      .auth-card h1 {
        font-family: var(--font-display);
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--color-text);
        margin: 0 0 0.5rem;
      }
      .auth-card > p {
        font-size: 0.95rem;
        color: var(--color-muted);
        font-style: italic;
        margin: 0 0 2rem;
      }
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        text-align: left;
      }
      .login-form label {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .login-form .field-label {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--color-text);
      }
      .login-form input {
        padding: 0.85rem 1rem;
        font-family: var(--font-display);
        font-size: 1rem;
        color: var(--color-text);
        background: var(--color-white);
        border: 1px solid var(--color-border-soft);
        border-radius: 2px;
        transition: border-color var(--transition), box-shadow var(--transition);
      }
      .login-form input:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(139, 94, 60, 0.12);
      }
      .login-form input::placeholder { color: var(--color-muted); font-style: italic; }
      .login-error {
        min-height: 1.2rem;
        font-size: 0.85rem;
      }
      .login-error:not(:empty) {
        padding: 0.75rem;
        background: rgba(139, 58, 58, 0.08);
        color: #8b3a3a;
        border-radius: 2px;
        border: 1px solid rgba(139, 58, 58, 0.2);
      }
      .auth-footer { text-align: center; margin-top: 1.5rem; }
      .auth-footer a {
        font-size: 0.88rem;
        color: var(--color-muted);
        text-decoration: none;
        transition: color var(--transition);
      }
      .auth-footer a:hover { color: var(--color-primary); }
    </style>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card">
        <div class="auth-ornament" aria-hidden="true">&#10044;</div>
        <h1>Entrar no Acervo</h1>
        <p>Acesse o painel para gerenciar o acervo visual e editorial do museu.</p>
        <form id="login-form" class="login-form">
          <label for="username">
            <span class="field-label">Usuario</span>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Digite seu usuario" required />
          </label>
          <label for="password">
            <span class="field-label">Senha</span>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required />
          </label>
          <button class="btn btn--primary" type="submit" style="width:100%;margin-top:0.5rem;">
            Entrar no Painel
          </button>
          <p id="login-error" class="login-error" role="alert"></p>
        </form>
      </section>
      <div class="auth-footer">
        <a href="../index.html">&larr; Voltar para o site</a>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
