<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Leitura de destaque do blog Postais da Parnaíba sobre memória urbana e patrimônio visual da cidade.">
    <title>Post | Postais da Parnaíba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/blog.css">
    <link rel="stylesheet" href="../css/cronicas.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <header class="site-header" id="site-header">
        <div class="site-header__inner">
            <a href="../index.html" class="site-header__logo"><span class="site-header__logo-icon">✦</span>
                
                <span class="site-header__logo-text">Postais da Parnaíba</span>
            </a>

            <button class="site-header__toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="main-nav">
                <span></span><span></span><span></span>
            </button>

            <nav class="site-nav" id="main-nav" aria-label="Navegação principal">
                <a href="../index.html">Início</a>
                <a href="galeria.html">Galeria</a>
                <a href="livro.html">Livro</a>
                <a href="blog.html">Blog</a>
                <a href="sobre.html">Sobre</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="blog" aria-labelledby="post-title">
            <div class="container-blog">
                <article class="card card--post post-card post-single" id="post-content">
                    <p class="loading-spinner">Carregando artigo...</p>
                </article>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-footer__inner">
            <div class="site-footer__brand">
                <span class="site-footer__logo">✦ Postais da Parnaíba</span>
                <p>Museu digital de memória visual da cidade de Parnaíba.</p>
            </div>
            <div class="site-footer__links">
                <a href="galeria.html">Galeria</a>
                <a href="livro.html">Livro</a>
                <a href="sobre.html">Sobre</a>
            </div>
            <div class="site-footer__bottom">
                <p>© 2026 Postais da Parnaíba — Desenvolvido por Sallys Martins</p>
            </div>
        </div>
    </footer>
    <script src="../js/public.js"></script>
    <script>
    (async function() {
        var container = document.getElementById("post-content");
        var slug = getQueryParam("slug");
        if (!slug) {
            container.innerHTML = '<p>Artigo não encontrado.</p>';
            return;
        }
        try {
            var post = await fetchJson("/posts/" + slug);
            var imgUrl = getImageUrl(post.imagem_capa_url, "..");
            document.title = escapeHtml(post.titulo) + " | Postais da Parnaíba";
            container.innerHTML =
                '<img src="' + imgUrl + '" alt="' + escapeHtml(post.titulo) + '" loading="lazy" class="card__image">' +
                '<div class="card__body post-card-content">' +
                '<h2 id="post-title">' + escapeHtml(post.titulo) + '</h2>' +
                (post.autor ? '<p class="chronicle-card__author">Por: ' + escapeHtml(post.autor) + '</p>' : '') +
                '<div class="post-body">' + (post.conteudo || '') + '</div>' +
                '</div>';
        } catch (e) {
            container.innerHTML = '<p>Artigo não encontrado.</p>';
        }
    })();
    </script>
</body>
</html>
